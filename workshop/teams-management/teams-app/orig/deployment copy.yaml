apiVersion: v1
kind: Namespace
metadata:
  name: teams-ui
---  
# k8s/teams-ui-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: teams-ui-service
  namespace: teams-ui
  labels:
    app: teams-ui
    component: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: teams-ui
---
# k8s/teams-ui-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-ui
  namespace: teams-ui
  labels:
    app: teams-ui
    component: frontend
  annotations:
    commit-sha: 8b514a1cb354
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teams-ui
  template:
    metadata:
      labels:
        app: teams-ui
        component: frontend
    spec:
      containers:
      - name: teams-ui
        image: teams-ui:local      
#        image: olivercodes01/teams-app:0.0.7
        ports:
        - containerPort: 80
        env:
        - name: API_URL
          value: "http://teams-api-service.teams-api.svc.cluster.local:4200"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---          
# k8s/teams-api-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: teams-api-service
  namespace: teams-ui
  labels:
    app: teams-api
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: teams-api          
---
# k8s/teams-api-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teams-api
  namespace: teams-ui
  labels:
    app: teams-api
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teams-api
  template:
    metadata:
      labels:
        app: teams-api
        component: backend
    spec:
      containers:
      - name: teams-api
        image: olivercodes01/teams-api:0.0.2
        ports:
        - containerPort: 8000
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teams-api-ingress
  namespace: teams-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    kubernetes.io/ingress.class: traefik
spec:
  rules:
  - host: teams-api.127.0.0.1.sslip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: teams-api-service
            port:
              number: 8000          