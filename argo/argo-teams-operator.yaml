apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-teams-operator
  namespace: argocd
spec:
  destination:
    namespace: teams-operator
    server: https://kubernetes.default.svc
  project: engineering-platform
  source:
    path: argo/teams-operator
    repoURL: https://github.com/joengineering/eng-platform
    targetRevision: jo/final
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
